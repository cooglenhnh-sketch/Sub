<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>VPN Config Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body { font-family: Vazirmatn, sans-serif; overscroll-behavior-y: none; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .config-card { transition: all 0.2s ease; }
        .config-card:active { transform: scale(0.98); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-animate { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-lg z-20">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-lg font-bold">🚀 مدیریت کانفیگ</h1>
                <p class="text-xs text-blue-100" id="configCount">۰ کانفیگ ذخیره شده</p>
            </div>
            <button onclick="openModal()" class="bg-white text-blue-600 w-10 h-10 rounded-full shadow-lg flex items-center justify-center text-2xl font-bold hover:scale-105 transition">
                +
            </button>
        </div>
    </header>

    <!-- Filter Chips -->
    <div class="bg-white shadow-sm z-10 border-b">
        <div class="max-w-md mx-auto p-2 flex gap-2 overflow-x-auto hide-scrollbar" id="filterContainer">
            <button onclick="setFilter('all')" class="filter-chip px-4 py-1.5 rounded-full bg-blue-600 text-white text-sm font-medium whitespace-nowrap transition" data-filter="all">
                همه
            </button>
            <button onclick="setFilter('vmess')" class="filter-chip px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap transition" data-filter="vmess">
                VMess
            </button>
            <button onclick="setFilter('vless')" class="filter-chip px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap transition" data-filter="vless">
                VLESS
            </button>
            <button onclick="setFilter('trojan')" class="filter-chip px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap transition" data-filter="trojan">
                Trojan
            </button>
            <button onclick="setFilter('wireguard')" class="filter-chip px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap transition" data-filter="wireguard">
                WireGuard
            </button>
            <button onclick="setFilter('openvpn')" class="filter-chip px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap transition" data-filter="openvpn">
                OpenVPN
            </button>
        </div>
    </div>

    <!-- Main List -->
    <main class="flex-1 overflow-y-auto p-3 max-w-md mx-auto w-full" id="mainContainer">
        <div id="configList" class="space-y-3 pb-20"></div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center h-64 text-gray-400">
            <div class="text-6xl mb-4">📭</div>
            <p class="text-lg font-medium">هیچ کانفیگی نداری</p>
            <p class="text-sm mt-2">روی + بزن تا اضافه کنی</p>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="configModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 modal-animate max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800" id="modalTitle">کانفیگ جدید</h2>
                <button onclick="closeModal()" class="text-gray-400 text-2xl w-8 h-8 flex items-center justify-center">&times;</button>
            </div>

            <form onsubmit="saveConfig(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">نام کانفیگ</label>
                    <input type="text" id="configName" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-base" placeholder="مثال: سرور آلمان - تک">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">پروتکل</label>
                    <select id="configType" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="vmess">VMess (V2Ray)</option>
                        <option value="vless">VLESS</option>
                        <option value="trojan">Trojan</option>
                        <option value="ss">Shadowsocks</option>
                        <option value="wireguard">WireGuard</option>
                        <option value="openvpn">OpenVPN</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">لینک کانفیگ</label>
                    <textarea id="configUrl" required rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-xs font-mono dir-ltr text-left" placeholder="vmess://eyJhZGQiOiIxLjEuMS4x..."></textarea>
                    <p class="text-xs text-gray-500 mt-1">لینک سابسکریپشن یا لینک تک کانفیگ</p>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="pasteFromClipboard()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-200 transition text-sm">
                        📋 پیست از کلیپ‌بورد
                    </button>
                    <button type="submit" class="flex-[2] bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        ذخیره کانفیگ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center">
            <h3 class="font-bold text-lg mb-4 text-gray-800">اسکن کنید</h3>
            <div id="qrcode" class="flex justify-center mb-4 bg-white p-2 rounded-lg"></div>
            <p class="text-xs text-gray-500 mb-4 break-all dir-ltr text-left" id="qrUrl"></p>
